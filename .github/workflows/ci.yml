name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository / Получить репозиторий
        uses: actions/checkout@v7
      - name: Set up Node.js / Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run product checks / Запустить проверки продукта
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ci-check.log
      - name: Upload product-check evidence / Загрузить evidence проверки продукта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-product-check-${{ github.sha }}
          path: ci-check.log
          if-no-files-found: error
          retention-days: 14
      - name: Validate Cloudflare bundle / Проверить сборку Cloudflare
        run: npm run deploy:dry-run
