name: Deploy public Community production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: claryel-web-community-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository / Получить репозиторий
        uses: actions/checkout@v7
      - name: Set up Node.js / Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate product / Проверить продукт
        id: product_checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee community-production-check.log
      - name: Validate Worker bundle / Проверить сборку Worker
        id: worker_dry_run
        shell: bash
        run: |
          set -o pipefail
          npm run deploy:dry-run 2>&1 | tee community-worker-dry-run.log
      - name: Deploy Worker directly / Опубликовать Worker напрямую
        id: deploy_worker
        shell: bash
        run: |
          set -o pipefail
          {
            test -n "${CLOUDFLARE_API_TOKEN}"
            test -n "${CLOUDFLARE_ACCOUNT_ID}"
            npx --yes wrangler@4.112.0 deploy
          } 2>&1 | tee community-worker-deploy.log
      - name: Verify live Community contract / Проверить рабочий контракт Community
        id: live_verification
        shell: bash
        run: |
          set -euo pipefail
          origin="https://web.claryel.space"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/api/health" --output community-health.json \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/api/public-config" --output community-config.json \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/api/platform/compliance/manifest" --output community-compliance.json \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/legal/cookies/" --output community-cookie-policy.html \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/" --output community-home.html \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/ar/" --output community-ar.html \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/ru/" --output community-ru.html \
              && curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/sitemap.xml" --output community-sitemap.xml; then
              if node <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync('community-health.json','utf8'));
          const config=JSON.parse(fs.readFileSync('community-config.json','utf8'));
          const compliance=JSON.parse(fs.readFileSync('community-compliance.json','utf8'));
          const policy=fs.readFileSync('community-cookie-policy.html','utf8');
          const home=fs.readFileSync('community-home.html','utf8');
          const arabic=fs.readFileSync('community-ar.html','utf8');
          const russian=fs.readFileSync('community-ru.html','utf8');
          const sitemap=fs.readFileSync('community-sitemap.xml','utf8');
          const expected=['en','it','de','fr','es','nl','pt','pl','ro','cs','sv','el','da','fi','zh-CN','hi','ar','id','uk','ru'];
          if(health.status!=='ok'||health.version!=='0.4.0')process.exit(1);
          if(JSON.stringify(config.publicLocales)!==JSON.stringify(expected)||config.hiddenLocales.length!==0)process.exit(1);
          if(config.universeUrl!=='https://claryel.space/universe/')process.exit(1);
          if(compliance.version!=='2026-08-01.1'||compliance.site?.id!=='community'||JSON.stringify(compliance.languages)!==JSON.stringify(expected)||compliance.retentionDays!==180)process.exit(1);
          if(!policy.includes('2026-08-01.1')||!policy.includes('data-site="community"')||!policy.includes('data-claryel-compliance="runtime"'))process.exit(1);
          if(!home.includes('/claryel-standard.css?v=1.0.0')||!home.includes('/claryel-standard.js?v=1.0.0')||!home.includes('data-claryel-compliance="runtime"'))process.exit(1);
          if(!arabic.includes('lang="ar-SA" dir="rtl"')||!arabic.includes('data-hidden-locale="false"')||!arabic.includes('data-claryel-compliance="runtime"'))process.exit(1);
          if(!russian.includes('lang="ru-RU"')||!russian.includes('data-hidden-locale="false"')||!russian.includes('index,follow,max-image-preview:large')||!russian.includes('data-claryel-compliance="runtime"'))process.exit(1);
          if((sitemap.match(/<url>/g)||[]).length!==20)process.exit(1);
          NODE
              then
                printf 'Community production verification succeeded on attempt %s.\n' "$attempt" | tee community-production-verification.log
                exit 0
              fi
            fi
            sleep 10
          done
          printf 'Community production verification failed after retries.\n' | tee community-production-verification.log
          exit 1
      - name: Upload production evidence / Загрузить production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-production-evidence-${{ github.sha }}
          path: |
            community-production-check.log
            community-worker-dry-run.log
            community-worker-deploy.log
            community-production-verification.log
            community-health.json
            community-config.json
            community-compliance.json
            community-cookie-policy.html
            community-home.html
            community-ar.html
            community-ru.html
            community-sitemap.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Report production status / Сообщить статус production
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_OUTCOME: ${{ steps.product_checks.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.worker_dry_run.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          VERIFY_OUTCOME: ${{ steps.live_verification.outcome }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const checks=process.env.CHECKS_OUTCOME||'unknown';
          const dryRun=process.env.DRY_RUN_OUTCOME||'unknown';
          const deploy=process.env.DEPLOY_OUTCOME||'unknown';
          const verify=process.env.VERIFY_OUTCOME||'unknown';
          const success=[checks,dryRun,deploy,verify].every(value=>value==='success');
          let health='unavailable';
          let locales='unavailable';
          let compliance='unavailable';
          let deployTail='';
          try{health=JSON.parse(fs.readFileSync('community-health.json','utf8')).version||'unknown';}catch{}
          try{locales=JSON.parse(fs.readFileSync('community-config.json','utf8')).publicLocales?.length??'unknown';}catch{}
          try{compliance=JSON.parse(fs.readFileSync('community-compliance.json','utf8')).version||'unknown';}catch{}
          try{deployTail=fs.readFileSync('community-worker-deploy.log','utf8').trim().split(/\r?\n/).slice(-18).join('\n');}catch{}
          const body=[
            `Community production deployment: **${success?'SUCCESS / УСПЕХ':'FAILURE / ОШИБКА'}**`,
            `Commit: \`${process.env.GITHUB_SHA}\``,
            `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `Product checks: ${checks}`,
            `Worker dry-run: ${dryRun}`,
            `Cloudflare deploy: ${deploy}`,
            `Live verification: ${verify}`,
            `Live product version: ${health}`,
            `Compliance version: ${compliance}`,
            `Public locales: ${locales}`,
            `Universe URL: https://claryel.space/universe/`,
            !success&&deployTail?`Deploy output tail:\n\n\`\`\`text\n${deployTail.slice(-3500)}\n\`\`\``:''
          ].filter(Boolean).join('\n\n');
          fs.writeFileSync('/tmp/community-deploy-comment.json',JSON.stringify({body}));
          NODE
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/17/comments" \
            --data-binary @/tmp/community-deploy-comment.json
