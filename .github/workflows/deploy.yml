name: Validate public Community release

# Validate the public repository while the protected managed platform owns production deployment.
# Проверять публичный репозиторий, пока production-публикацией владеет защищённая управляемая платформа.
# Verify version 0.5.0, presentationModes, voiceWorkspace, view=classic and all 40 public routes.
# Проверять версию 0.5.0, presentationModes, voiceWorkspace, view=classic и все 40 публичных маршрутов.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claryel-web-community-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository / Получить репозиторий
        uses: actions/checkout@v7

      - name: Set up Node.js / Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate product / Проверить продукт
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Validate Worker bundle / Проверить сборку Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:dry-run

      - name: Verify managed production / Проверить управляемый production
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          origin='https://web.claryel.space'
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/api/health?validation=${GITHUB_SHA}" --output community-health.json
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/api/public-config?validation=${GITHUB_SHA}" --output community-config.json
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${origin}/sitemap.xml?validation=${GITHUB_SHA}" --output community-sitemap.xml
          node <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync('community-health.json','utf8'));
          const config=JSON.parse(fs.readFileSync('community-config.json','utf8'));
          const sitemap=fs.readFileSync('community-sitemap.xml','utf8');
          const expected=['en','it','de','fr','es','nl','pt','pl','ro','cs','sv','el','da','fi','zh-CN','hi','ar','id','uk','ru'];
          if(health.status!=='ok'||health.version!=='0.5.0')throw new Error('Managed Community health contract failed.');
          if(JSON.stringify(health.presentationModes)!==JSON.stringify(['immersive','classic']))throw new Error('Managed presentation modes are incomplete.');
          if(JSON.stringify(config.publicLocales)!==JSON.stringify(expected)||config.hiddenLocales?.length!==0)throw new Error('Managed locale contract failed.');
          if(config.voiceWorkspace!=='/classic/'||config.universeUrl!=='https://claryel.space/universe/')throw new Error('Managed navigation contract failed.');
          if((sitemap.match(/<url>/g)||[]).length!==40)throw new Error('Managed sitemap must contain forty routes.');
          console.log('Managed Community production contract passed.');
          NODE

      - name: Record deployment ownership / Зафиксировать владельца публикации
        shell: bash
        run: |
          {
            echo '## Production ownership / Владение production'
            echo
            echo 'Production deployment is executed by the protected `claryel-space` managed release workflow using the exact commit from its release manifest.'
            echo
            echo 'Production-публикация выполняется защищённым managed release workflow репозитория `claryel-space` по точному коммиту из release-манифеста.'
          } >> "${GITHUB_STEP_SUMMARY}"
