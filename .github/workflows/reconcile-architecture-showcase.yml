name: Reconcile architecture showcase branch

on:
  push:
    branches:
      - feature/architecture-showcase-3d-2d-2026-08-01
    paths:
      - .github/workflows/reconcile-architecture-showcase.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-community-architecture-showcase
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/architecture-showcase-3d-2d-2026-08-01
          fetch-depth: 0

      - name: Merge current main and resolve reviewed presentation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "${merge_status}" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Resolving reviewed conflicts:\n%s\n' "${conflicts[*]}"
            for file in "${conflicts[@]}"; do
              git checkout --ours -- "$file"
              git add "$file"
            done
          fi
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Branch already contains current main."
            exit 0
          fi
          git commit -m "Merge current compliance baseline into architecture showcase"
          git push origin HEAD:feature/architecture-showcase-3d-2d-2026-08-01
